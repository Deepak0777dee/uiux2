<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — STACKLY</title>
  <meta name="description"
    content="Sign in to your STACKLY account. Access customized digital marketing, consulting, and analytics tools." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

  <!-- Auth Styles -->
  <link rel="stylesheet" href="css/auth.css" />
</head>

<body class="auth-page">

  <!-- Top Right "Back to Home" Button -->
  <a href="index.html" class="auth-back-home" title="Back to Home">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Back to Home</span>
  </a>

  <!-- Auth Container with Split Layout -->
  <div class="auth-container">

    <!-- Left Half: Form Panel -->
    <div class="auth-panel-left">
      <!-- Top Logo Header aligned directly with the Welcome form card -->
      <div class="auth-panel-top">
        <div class="auth-panel-top-inner">
          <a href="index.html" class="auth-brand-logo" title="STACKLY Home">
            <img src="images/logo-stackly.webp" alt="STACKLY" class="site-logo" />
          </a>
        </div>
      </div>

      <div class="auth-form-card">

        <h1 class="auth-heading">Welcome</h1>
        <p class="auth-subheading">Login with Email</p>

        <!-- Status / Feedback Alert Banner -->
        <div class="auth-alert" id="signin-alert"></div>

        <form class="auth-form" id="signin-form" novalidate>
          <input type="hidden" id="selected-role" value="user" />

          <!-- Input 1: Email / Name -->
          <div class="auth-input-group">
            <span class="auth-notch-label">Name</span>
            <div class="auth-input-box">
              <span class="auth-input-icon">
                <i class="fa-regular fa-envelope"></i>
              </span>
              <input type="email" class="auth-input" id="signin-email" placeholder="Enter your email"
                autocomplete="email" required />
            </div>
            <div class="field-error-text" id="signin-email-error"></div>
          </div>

          <!-- Input 2: Password -->
          <div class="auth-input-group">
            <span class="auth-notch-label">Password</span>
            <div class="auth-input-box">
              <span class="auth-input-icon">
                <i class="fa-solid fa-lock"></i>
              </span>
              <input type="password" class="auth-input" id="signin-password" placeholder="Enter your password"
                autocomplete="current-password" required />
              <button type="button" class="auth-password-toggle" data-target="signin-password"
                title="Toggle password visibility">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <div class="field-error-text" id="signin-password-error"></div>
          </div>

          <!-- Select Role: User / Admin -->
          <div class="auth-role-wrapper">
            <span class="auth-role-label">Select Role</span>
            <div class="auth-role-buttons">
              <button type="button" class="role-pill-btn active" data-role="user" id="role-btn-user">User</button>
              <button type="button" class="role-pill-btn" data-role="admin" id="role-btn-admin">Admin</button>
            </div>
          </div>

          <!-- Forgot Password (Unused button -> navigates to 404) -->
          <div class="auth-forgot-link-wrapper">
            <a href="404.html" class="auth-forgot-link">Forgot your password?</a>
          </div>

          <!-- Submit Action Button -->
          <div class="auth-submit-btn-wrapper">
            <button type="submit" class="auth-submit-btn" id="btn-signin-submit">LOGIN</button>
          </div>

          <!-- OR Divider -->
          <div class="auth-divider">
            <span>OR</span>
          </div>

          <!-- Social Buttons Row (Unused buttons -> navigate to 404) -->
          <div class="auth-social-row">
            <!-- Google -->
            <a href="404.html" class="auth-social-btn" title="Sign in with Google">
              <svg class="auth-social-icon" viewBox="0 0 24 24">
                <path fill="#4285F4"
                  d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" />
                <path fill="#34A853"
                  d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" />
                <path fill="#FBBC05"
                  d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z" />
                <path fill="#EA4335"
                  d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" />
              </svg>
            </a>

            <!-- Facebook -->
            <a href="404.html" class="auth-social-btn" title="Sign in with Facebook">
              <svg class="auth-social-icon" viewBox="0 0 24 24" fill="#1877F2">
                <path
                  d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
              </svg>
            </a>

            <!-- Apple -->
            <a href="404.html" class="auth-social-btn" title="Sign in with Apple">
              <svg class="auth-social-icon" viewBox="0 0 24 24" fill="#000000">
                <path
                  d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.89c.65-.79 1.09-1.89.97-2.99-.95.04-2.09.64-2.77 1.43-.59.68-1.11 1.79-.97 2.87 1.05.08 2.12-.52 2.77-1.31z" />
              </svg>
            </a>
          </div>

          <!-- Switch to Sign Up -->
          <p class="auth-switch-text">
            Don't have account?
            <a href="signup.html" class="auth-switch-link">Register Now</a>
          </p>

        </form>

      </div>
    </div>

    <!-- Right Half: Clear View of Workspace & Laptop -->
    <div class="auth-panel-right">
      <span class="auth-copyright-tag">&copy; STACKLY Business 2026</span>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
</body>

</html>
